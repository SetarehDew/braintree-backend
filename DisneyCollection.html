    body {

    .main-header {

    .page-title {

    }

    .btn {

      background: rgb(213, 36, 36);
      color: black;

      text-decoration: none;
      font-weight: bold;

    }
    .logo {

      font-size: 2rem;
      font-weight: bold;
    }

    .logo img {
    width: 40px;            /* 👈 controls logo size */

    object-fit: contain;
  }
  .fade-carousel{
  position: relative;
  height: 420px;
  width: 100%;
  max-width: 420px;
  margin: 0 auto 20px;
 }


.fade-carousel img {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  height: 400px;
  object-fit: contain;
  opacity: 0 !important;
  transition: opacity 0.4s ease;
  z-index: 1;        /* 👈 ADD THIS */
}

.fade-carousel img.active {
  opacity: 1 !important;
  z-index: 2;        /* 👈 active image always sits above inactive ones */
}

.carousel-btn {
  position: absolute;
  top: 40%;
  transform: translateY(-50%);
  z-index: 5;
  border: none;
  background: rgba(47, 36, 29, 0.75);
  color:white;
  font-size: 2rem;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  cursor: pointer;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.carousel-dots {
  position: absolute;
  bottom: 8px;
  left: 0;
  width: 100%;
  text-align: center;
  z-index: 5;
}

.carousel-btn.prev {
  left: 0;
}

.carousel-btn.next {
  right: 0;
}

.dot {
  display: inline-block;
  width: 10px;
  height: 10px;
  margin: 0 5px;
  background: #c9b8a8;
  border-radius: 50%;
  cursor: pointer;
}

.dot.active {
  background: #2f241d;
}

.price {
  display: block;
  font-size: 2rem;
  font-weight: bold;
  margin: 10px 0;
  text-align: center;
}

.btn {
  display: block;
  margin: 0 auto;
  width: fit-content;
}

.product-card {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.product-card h3 {
  font-size: 2.5rem;
  font-weight: bold;
  margin-bottom: 8px;
}

/* ===== SPARKLE ANIMATION ===== */
.sparkles {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

.sparkle {
  position: absolute;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: white;
  animation: sparkle-float linear infinite;
  opacity: 0;
}

@keyframes sparkle-float {
  0%   { transform: translateY(100vh) scale(0); opacity: 0; }
  10%  { opacity: 1; }
  90%  { opacity: 1; }
  100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
}

/* ===== GOLD SHIMMER TITLE ===== */
.page-title h1 {
  font-size: 7rem;
  margin-bottom: 10px;
  background: linear-gradient(90deg, #ff2020, #ffd700, #ff2020, #ffd700);
  background-size: 300% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: shimmer 4s linear infinite;
  text-shadow: none;
}

@keyframes shimmer {
  0%   { background-position: 0% center; }
  100% { background-position: 300% center; }
}

/* ===== DECORATIVE BANNER/RIBBON ===== */
.title-ribbon {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin: 10px auto 30px;
  max-width: 600px;
}

.title-ribbon::before,
.title-ribbon::after {
  content: "";
  flex: 1;
  height: 2px;
  background: linear-gradient(to right, transparent, #ffd700, transparent);
}

.title-ribbon span {
  color: #ffd700;
  font-size: 1.5rem;
  letter-spacing: 0.2em;
  font-style: italic;
}


</style>

 <script>
function updateCarousel(carousel, newIndex) {
  const images = carousel.querySelectorAll(".slide");
  const dots = carousel.querySelectorAll(".dot");

  images.forEach(img => img.classList.remove("active"));
  dots.forEach(dot => dot.classList.remove("active"));

  images[newIndex].classList.add("active");
  dots[newIndex].classList.add("active");

  carousel.dataset.index = newIndex;
}

function changeSlide(button, direction) {
  const carousel = button.closest(".fade-carousel");
  const images = carousel.querySelectorAll(".slide");
  let index = Number(carousel.dataset.index || 0);

  index = index + direction;

  if (index < 0) index = images.length - 1;
  if (index >= images.length) index = 0;

  updateCarousel(carousel, index);
}

function goToSlide(dot, index) {
  const carousel = dot.closest(".fade-carousel");
  updateCarousel(carousel, index);
}
</script><script>
  // Generate sparkles
  const container = document.getElementById('sparkles');
  const colors = ['#ffd700', '#ffffff', '#ffec8b', '#ffe4e1', '#ff9999'];

  for (let i = 0; i < 60; i++) {
    const sparkle = document.createElement('div');
    sparkle.classList.add('sparkle');

    const size = Math.random() * 8 + 3;
    sparkle.style.width = size + 'px';
    sparkle.style.height = size + 'px';
    sparkle.style.left = Math.random() * 100 + 'vw';
    sparkle.style.animationDuration = (Math.random() * 6 + 4) + 's';
    sparkle.style.animationDelay = (Math.random() * 8) + 's';
    sparkle.style.background = colors[Math.floor(Math.random() * colors.length)];

    container.appendChild(sparkle);
  }
</script>
